name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
  probe-py36:
    runs-on: ubuntu-latest
    container: python:3.6-slim
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile node_monitor/probe/probe.py
      - run: python node_monitor/probe/probe.py --once > out.jsonl
      - run: python -c "import json; ts=[json.loads(l)['type'] for l in open('out.jsonl')]; assert ts == ['hello','counters','census'], ts"
