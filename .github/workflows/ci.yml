name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every Python version even when one fails.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_MONITOR_TEST_ADMIN_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
  probe-py36:
    runs-on: ubuntu-latest
    container: python:3.6-slim
    steps:
      - uses: actions/checkout@v4
      - run: python -m py_compile node_monitor/probe/probe.py
      - run: python node_monitor/probe/probe.py --once > out.jsonl
      - run: python -c "import json; ts=[json.loads(l)['type'] for l in open('out.jsonl')]; assert ts == ['hello','counters','census'], ts"
