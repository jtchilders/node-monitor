<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}node-monitor{% endblock %}</title>
<link rel="stylesheet" href="/static/css/dashboard.css">
{% block head %}{% endblock %}
</head>
<body>
<nav style="display:flex; gap:1rem; padding:0.4rem 1rem; background:#0f172a; border-bottom:1px solid #1e293b; font-size:0.85rem;">
  <a href="/" style="color:#e2e8f0; text-decoration:none; font-weight:600;">Live</a>
  <a href="/analytics" style="color:#94a3b8; text-decoration:none;">Analytics</a>
  <a href="/commands" style="color:#94a3b8; text-decoration:none;">Commands</a>
</nav>
<header id="health-strip" aria-live="polite">
<span class="health-loading">loading…</span>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script src="/static/vendor/vue.global.prod.js"></script>
<script src="/static/vendor/chart.umd.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
