[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "node-monitor"
version = "0.1.0"
description = "Login-node monitor for ALCF systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["click>=8.1", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
node-monitor = "node_monitor.cli.main:cli"

[tool.setuptools.packages.find]
include = ["node_monitor*"]

[tool.setuptools.package-data]
"node_monitor.probe" = ["probe.py"]

[tool.ruff]
indent-width = 3
line-length = 100
target-version = "py310"
extend-exclude = ["docs"]

[tool.ruff.format]
docstring-code-format = false

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
