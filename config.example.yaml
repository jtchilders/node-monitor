# node-monitor configuration. Search order: --config PATH, $NODE_MONITOR_CONFIG,
# ~/.node_monitor.yaml, ~/.config/node_monitor/config.yaml
system: polaris
nodes:                               # host = node identity; ssh_target = how to reach it
  - host: polaris-login-01.hsn.cm.polaris.alcf.anl.gov
    label: login-01
    ssh_target: polaris-login-01.head  # optional; defaults to host
  - host: polaris-login-02.hsn.cm.polaris.alcf.anl.gov
    label: login-02
    ssh_target: polaris-login-02.head
  - host: polaris-login-04.hsn.cm.polaris.alcf.anl.gov
    label: login-04
    ssh_target: polaris-login-04.head
ssh:
  identity_file: ~/.ssh/id_ed25519_polaris   # optional; written into the project ssh_config
  connect_timeout_sec: 10
probe_python: /usr/bin/python3.11
working_dir: ~/node-monitor          # logs/ and state/ live here

# database/web/retention/spool configure the M1b database writer and readers.
# A URL containing a password requires this file to have mode 0600.
# Env overrides: NODE_MONITOR_DB_URL, NODE_MONITOR_WEB_DB_URL.
database:
  url: postgresql://node_monitor_owner@localhost/node_monitor
web:
  database_url: postgresql://node_monitor_reader@localhost/node_monitor
  host: 127.0.0.1
  port: 9998

collection:
  counter_interval_sec: 10
  census_interval_sec: 60
  summary_interval_sec: 300          # multiple of census_interval_sec; divides 3600
  hourly_census: true                # M3
  session_silence_timeout_sec: 30
  session_max_lifetime_sec: 21600
  reconnect_backoff_sec: [5, 300]
  probe_rss_limit_mb: 128            # probe says bye and is restarted above this RSS
classification:
  min_user_uid: 1000                 # a user process has uid >= this
  active_cpu_seconds_per_min: 0.1
  notable_cpu_seconds_per_min: 3.0   # M3; about 5% of one core
  notable_rss_mb: 1024               # M3
redaction:
  extra_patterns: []                 # regexes, appended to built-in rules
retention:
  process_samples_days: 30
  node_metrics_days: 730
  usage_summary_days: 730
  command_lines_days: 730            # measured from last_seen
  collection_events_days: 180
spool:
  max_bytes: 1073741824
