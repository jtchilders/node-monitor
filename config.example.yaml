# Phase 0 canary daemon configuration.
#
# Copy to config.yaml on the deployment host and edit -- config.yaml is
# gitignored and never committed. This file is illustrative and
# intentionally contains no site-specific detail: the daemon refuses to
# start on any unknown key.
#
# Corrected against node_monitor.config's strict loader (Phase 0):
# nodes now declare an explicit local/remote role (exactly one local
# node is required), probe_python must name an explicit versioned
# interpreter, and output_root must resolve under the deploying user's
# home directory (never under /tmp).

system: polaris

nodes:
  - hostname: polaris-login-04.hsn.cm.polaris.alcf.anl.gov
    role: local
  - hostname: polaris-login-01.hsn.cm.polaris.alcf.anl.gov
    role: remote
  - hostname: polaris-login-02.hsn.cm.polaris.alcf.anl.gov
    role: remote

# Root directory for the run's phase0-<run-id>/ artifact directory (see
# node_monitor.output.jsonl.Phase0Sink). Must resolve under $HOME.
output_root: ~/phase0-runs

# Explicit, versioned remote/local probe interpreter -- never a bare
# "python3" default. Login nodes ship an old system python3; this must
# name the discovered >=3.9 interpreter for the target system.
probe_python: /usr/bin/python3.11

# --- Everything below has a built-in default; only override what you
# --- need to change from PHASE0_DAEMON_DESIGN.md's approved values.

counter_interval_sec: 10
census_interval_sec: 60
rollup_interval_sec: 60
usage_interval_sec: 900
duration_sec: 86400

counter_timeout_sec: 4
census_timeout_sec: 20
ssh_connect_timeout_sec: 8

max_parallel_polls: 8

# Output filesystem free-space floor. The daemon treats output write/flush
# failure and low disk as fatal -- JSONL is the only Phase 0 result.
min_free_disk_pct: 10
